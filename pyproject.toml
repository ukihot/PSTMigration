[project]
name = "pstmigration"
version = "1.2.2"
description = "POP時代のPSTを日付で分割し、ファイルサーバへ回収するGPO配布ツール"
requires-python = ">=3.12"
dependencies = ["pywin32>=306"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "pyinstaller>=6.10",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
